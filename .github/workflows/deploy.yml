name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Action versions match GitHub's official Pages starter workflows.
# Pages deploys need an OIDC token and write access to Pages only.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a production deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck + production bundle (vite base is './', so it works under /<repo>/)
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
